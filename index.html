<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Old Yellow Door</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<style>
		:root {
			--bg: #fbf6e6;
			--ink: #2b2a26;
			--muted: #6f6a5c;
			--tile: #ffffff;
			--border: #e8dfc3;
			--accent: #f2c230;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #1b1a17;
				--ink: #f3efe2;
				--muted: #a9a290;
				--tile: #26251f;
				--border: #3a382f;
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 32px 16px;
			background: var(--bg);
			color: var(--ink);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		h1 {
			margin: 0 0 32px;
			font-size: clamp(1.75rem, 5vw, 2.5rem);
			font-weight: 700;
			letter-spacing: -0.01em;
		}
		h1 img {
			width: 1.1em;
			height: 1.1em;
			margin-right: 0.3em;
			vertical-align: -0.15em;
		}
		.tiles {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 24px;
			width: 100%;
			max-width: 760px;
		}
		.tile {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
			padding: 36px 20px 28px;
			border: 1px solid var(--border);
			border-radius: 20px;
			background: var(--tile);
			color: inherit;
			text-decoration: none;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
			transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
		}
		.tile:hover,
		.tile:focus-visible {
			transform: translateY(-4px);
			border-color: var(--accent);
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
			outline: none;
		}
		.tile img {
			width: 112px;
			height: 112px;
		}
		.tile span {
			font-size: 1.35rem;
			font-weight: 600;
			text-align: center;
		}
		@media (prefers-reduced-motion: reduce) {
			.tile { transition: none; }
			.tile:hover, .tile:focus-visible { transform: none; }
		}
	</style>
</head>
<body>
	<h1><img src="favicon.svg" alt="">Old Yellow Door</h1>
	<main class="tiles">
		<a class="tile" href="https://smartybryan.github.io/block-placer/" target="_blank" rel="noopener">
			<img src="icons/block-placer.svg" alt="">
			<span>Block Placer</span>
		</a>
		<a class="tile" href="https://smartybryan.github.io/kids-drawing-game/" target="_blank" rel="noopener">
			<img src="icons/color-me.svg" alt="">
			<span>Color Me</span>
		</a>
		<a class="tile" href="http://50.6.22.144:8080/" target="_blank" rel="noopener">
			<img src="icons/puzzle-table.svg" alt="">
			<span>Puzzle Table</span>
		</a>
		<a class="tile" href="https://smartybryan.github.io/pop-the-bubbles/" target="_blank" rel="noopener">
			<img src="icons/pop-the-bubbles.svg" alt="">
			<span>Pop the Bubbles</span>
		</a>
		<a class="tile" href="https://smartybryan.github.io/kanipad/" target="_blank" rel="noopener">
			<img src="icons/kanipad.svg" alt="">
			<span>Kanipad</span>
		</a>
	</main>
</body>
</html>
